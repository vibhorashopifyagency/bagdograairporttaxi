<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Shown by the installed office dashboard when the phone has no signal. Nothing about customers is stored on the phone." />
    <meta name="theme-color" content="#111111" />
    <title>No connection · Bagdogra Airport Taxi office</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: #f4f5f7; color: #111; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.55; }
      main { width: 100%; max-width: 30rem; overflow: hidden; border: 1px solid #e8e8e8; border-radius: 20px; background: #fff; }
      .top { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.25rem; background: #111; color: #fff; }
      .top img { width: 44px; height: 44px; }
      .top strong { font-size: 1.05rem; }
      .body { padding: 1.5rem 1.25rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; line-height: 1.2; }
      p { margin: 0 0 0.75rem; color: #3d4451; }
      button { min-height: 3rem; width: 100%; margin-top: 0.5rem; border: 0; border-radius: 0.75rem; background: #111; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      .dot { display: inline-block; width: 0.6rem; height: 0.6rem; margin-right: 0.4rem; border-radius: 999px; background: #ffb300; }
    </style>
  </head>
  <body>
    <main>
      <div class="top"><img src="/logo-dark.png" alt="" width="44" height="44" /><strong>Bagdogra Airport Taxi office</strong></div>
      <div class="body">
        <h1><span class="dot" aria-hidden="true"></span>No connection</h1>
        <p>The dashboard needs the internet to show bookings, so nothing about customers is kept on this phone.</p>
        <p>Calls and WhatsApp still work from your phone's own apps. This page tries again by itself when the signal returns.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
    <script>
      addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
